<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <!-- Brand Emblem: Healing Leaf & Cross in Deep Forest Green, Teal and Warm Gold -->
  <g transform="translate(10, 10)">
    <!-- Primary Hexagonal Shield/Emblem -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#0B3D2E"/>
    <!-- Healthcare Cross in Teal -->
    <path d="M40 22V58M22 40H58" stroke="#087E8B" stroke-width="8" stroke-linecap="round"/>
    <!-- Organic Healing Sprout Leaf in Warm Gold -->
    <path d="M40 40C40 28 52 24 58 24C58 30 54 42 42 42" fill="#C99A3D"/>
    <!-- Compassionate Seed dot in Warm Gold -->
    <circle cx="40" cy="40" r="4.5" fill="#C99A3D"/>
  </g>
  <!-- Wordmark: GraminCare in Deep Forest Green and AI in Warm Gold & Teal -->
  <text x="106" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0B3D2E" letter-spacing="-0.5">GraminCare</text>
  <rect x="306" y="27" width="46" height="30" rx="8" fill="#C99A3D"/>
  <text x="329" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#F7F4EC" text-anchor="middle" letter-spacing="1">AI</text>
  <text x="108" y="74" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#087E8B" letter-spacing="1.8">RURAL HEALTHCARE TECHNOLOGY</text>
</svg>
